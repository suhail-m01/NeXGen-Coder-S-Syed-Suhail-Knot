name: Autonomous Hackathon Discovery Agent

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch: # Manual on-demand trigger

concurrency:
  group: hackathon-discovery-agent
  cancel-in-progress: false

jobs:
  discover:
    name: Run Discovery Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Discovery Agent
        run: npm run agent:hackathons
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEARCH_API_PROVIDER: ${{ secrets.SEARCH_API_PROVIDER }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVENTBRITE_API_KEY: ${{ secrets.EVENTBRITE_API_KEY }}
          MEETUP_API_KEY: ${{ secrets.MEETUP_API_KEY }}
          HACKATHON_CONCURRENCY: 3
          HACKATHON_MAX_DOCUMENTS: 24
          HACKATHON_MAX_ITEMS: 500
